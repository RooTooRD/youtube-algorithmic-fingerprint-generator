[project]
name = "yafg"
version = "0.1.0"
description = "Persona-driven agents that build real YouTube watch histories, for auditing algorithmic personalization"
authors = [{ name = "abderrahmane" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "anthropic>=0.73.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "playwright>=1.56.0",
    "polars>=1.35.0",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "typer>=0.20.0",
]

[project.scripts]
yafg = "yafg.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yafg"]

[tool.ruff]
fix = true
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
root = ["./src"]
python-version = "3.13"
